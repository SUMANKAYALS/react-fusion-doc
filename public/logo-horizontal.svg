<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 100" width="100%" height="100%">
  <defs>
    <linearGradient id="fusionGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C3AED" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>
  
  <!-- Icon -->
  <g transform="translate(10, 10) scale(0.8)">
    <!-- Atom Orbits -->
    <g stroke="url(#fusionGrad)" stroke-width="4" fill="none" opacity="0.8">
      <ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(30 50 50)" />
      <ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(150 50 50)" />
      <ellipse cx="50" cy="50" rx="40" ry="15" transform="rotate(90 50 50)" />
    </g>

    <!-- Lightning Bolt -->
    <path d="M52 25 L35 55 L48 55 L45 75 L65 45 L52 45 Z" fill="url(#fusionGrad)" />
  </g>

  <!-- Text -->
  <text x="100" y="65" font-family="Inter, sans-serif" font-weight="bold" font-size="42" fill="#E5E7EB">React <tspan fill="url(#fusionGrad)">Fusion</tspan></text>
</svg>
