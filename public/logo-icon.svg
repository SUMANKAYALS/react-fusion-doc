<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Minimalist Vercel/React-like Atom -->
  <g stroke="currentColor" stroke-width="6" fill="none" transform="translate(50,50)">
    <!-- Orbits -->
    <ellipse rx="40" ry="15" transform="rotate(0)" />
    <ellipse rx="40" ry="15" transform="rotate(60)" />
    <ellipse rx="40" ry="15" transform="rotate(120)" />
    <!-- Center Core -->
    <circle r="8" fill="currentColor" stroke="none" />
  </g>
</svg>
