<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <style>
    path, circle, ellipse {
      stroke: #000;
      fill: none;
    }
    .core { fill: #000; stroke: none; }
    @media (prefers-color-scheme: dark) {
      path, circle, ellipse { stroke: #fff; }
      .core { fill: #fff; }
    }
  </style>
  <g stroke-width="8" transform="translate(50,50)">
    <!-- Orbits -->
    <ellipse rx="38" ry="14" transform="rotate(0)" />
    <ellipse rx="38" ry="14" transform="rotate(60)" />
    <ellipse rx="38" ry="14" transform="rotate(120)" />
    <!-- Center Core -->
    <circle r="10" class="core" />
  </g>
</svg>
